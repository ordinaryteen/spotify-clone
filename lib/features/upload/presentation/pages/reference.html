<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1db954",
                        "background-light": "#f6f8f7",
                        "background-dark": "#121212",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <title>Upload Song</title>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
    <div
        class="relative flex h-auto min-h-screen w-full max-w-md mx-auto flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
        <!-- Header -->
        <header class="flex items-center p-6 justify-between">
            <button
                class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-white/10 transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
            </button>
            <h2
                class="text-slate-900 dark:text-slate-100 text-xl font-bold leading-tight tracking-tight flex-1 text-center pr-10">
                Upload Song</h2>
        </header>
        <main class="flex flex-col p-6 gap-8">
            <!-- Cover Art Picker -->
            <section class="flex flex-col gap-3">
                <p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Cover Art</p>
                <div
                    class="flex flex-col items-center justify-center aspect-square w-full rounded-xl border-2 border-dashed border-slate-300 dark:border-white/20 bg-slate-50 dark:bg-white/5 hover:border-primary dark:hover:border-primary transition-colors cursor-pointer group">
                    <div class="flex flex-col items-center gap-4">
                        <div
                            class="size-16 rounded-full bg-slate-200 dark:bg-white/10 flex items-center justify-center group-hover:bg-primary/20 transition-colors">
                            <span
                                class="material-symbols-outlined text-4xl text-slate-500 dark:text-slate-400 group-hover:text-primary">image</span>
                        </div>
                        <div class="flex flex-col items-center gap-1">
                            <p class="text-slate-900 dark:text-slate-100 text-lg font-bold">Choose Cover Art</p>
                            <p class="text-slate-500 dark:text-slate-400 text-sm">3000 x 3000px recommended</p>
                        </div>
                    </div>
                </div>
            </section>
            <!-- Audio File Picker -->
            <section class="flex flex-col gap-3">
                <p class="text-slate-900 dark:text-slate-100 text-base font-semibold">Upload Audio</p>
                <div
                    class="flex items-center gap-4 bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 rounded-xl p-4 hover:border-primary transition-colors cursor-pointer">
                    <div
                        class="flex size-12 items-center justify-center rounded-lg bg-primary/10 text-primary shrink-0">
                        <span class="material-symbols-outlined">audiotrack</span>
                    </div>
                    <div class="flex flex-col justify-center flex-1">
                        <p class="text-slate-900 dark:text-slate-100 text-base font-medium">Select MP3 or WAV file</p>
                        <p class="text-slate-500 dark:text-slate-400 text-xs">Max file size 50MB</p>
                    </div>
                    <div class="shrink-0 text-slate-400">
                        <span class="material-symbols-outlined">cloud_upload</span>
                    </div>
                </div>
            </section>
            <!-- Metadata Fields -->
            <section class="flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                    <label class="text-slate-900 dark:text-slate-100 text-sm font-semibold px-1">Song Title</label>
                    <input
                        class="w-full rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/5 p-4 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-400"
                        placeholder="Enter the title of your track" type="text" />
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-slate-900 dark:text-slate-100 text-sm font-semibold px-1">Artist Name</label>
                    <input
                        class="w-full rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/5 p-4 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-slate-400"
                        placeholder="Who is the artist?" type="text" />
                </div>
                <div class="flex flex-col gap-2">
                    <label class="text-slate-900 dark:text-slate-100 text-sm font-semibold px-1">Genre
                        (Optional)</label>
                    <div class="relative">
                        <select
                            class="w-full appearance-none rounded-xl border border-slate-200 dark:border-white/10 bg-slate-50 dark:bg-white/5 p-4 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
                            <option>Electronic</option>
                            <option>Hip Hop</option>
                            <option>Pop</option>
                            <option>Rock</option>
                            <option>Jazz</option>
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                            <span class="material-symbols-outlined">expand_more</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <!-- Footer Action -->
        <footer class="mt-auto p-6 pt-2 pb-10">
            <button
                class="w-full h-14 bg-primary text-black text-lg font-bold rounded-full shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
                <span>Upload Song</span>
            </button>
        </footer>
    </div>
</body>

</html>
